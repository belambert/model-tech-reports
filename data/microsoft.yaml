company: Microsoft
openness: open

families:
  - name: Phi
    category: llm
    releases:
      - name: phi-1
        date: 2023-06
        note: "Open-weight; the largest linked checkpoint has about 1.4B total parameters; license: MIT"
        weights:
          - https://huggingface.co/microsoft/phi-1
        writeups:
          - kind: report
            title: Textbooks Are All You Need
            url: https://arxiv.org/abs/2306.11644
      - name: phi-1.5
        date: 2023-09
        note: "Open-weight; the largest linked checkpoint has about 1.4B total parameters; license: MIT"
