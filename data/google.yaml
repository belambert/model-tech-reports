        date: 2024-04
        writeups:
          - kind: report
            title: "RecurrentGemma: Moving Past Transformers for Efficient Open Language Models"
            url: https://arxiv.org/abs/2404.07839
      - name: CodeGemma
        date: 2024-06
        writeups:
          - kind: report
            title: "CodeGemma: Open Code Models Based on Gemma"
            url: https://arxiv.org/abs/2406.11409
      - name: Gemma 2
        date: 2024-07
        writeups:
          - kind: report
