        date: 2024-12
        writeups:
          - kind: report
            title: "PaliGemma 2: A Family of Versatile VLMs for Transfer"
            url: https://arxiv.org/abs/2412.03555
      - name: Gemma 3
        date: 2025-03
        writeups:
          - kind: report
            title: Gemma 3 Technical Report
            url: https://arxiv.org/abs/2503.19786
      - name: Gemma 3n
        date: 2025-06
        writeups:
          - kind: docs
            title: Gemma 3n
            url: https://ai.google.dev/gemma/docs/gemma-3n
      - name: Gemma 4
        date: 2026-07
        note: "Open-weight family under Apache 2.0: E2B and E4B on-device models, a 26B-A4B MoE, and a dense 31B"
        weights:
          - https://huggingface.co/google/gemma-4-31B-it
          - https://huggingface.co/google/gemma-4-26B-A4B-it
          - https://huggingface.co/google/gemma-4-E4B-it
          - https://huggingface.co/google/gemma-4-E2B-it
        writeups:
          - kind: report
            title: Gemma 4 Technical Report
            url: https://arxiv.org/abs/2607.02770
      - name: Gemma 4 12B
        date: 2026-05
        note: Open-weight 12B addition to the Gemma 4 family, Apache 2.0; see the Gemma 4 technical report for details
        weights:
          - https://huggingface.co/google/gemma-4-12B-it
          - https://huggingface.co/google/gemma-4-12B
        writeups:
          - kind: blog
            title: Introducing Gemma 4 12B
            url: https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemma-4-12B/

