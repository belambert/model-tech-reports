company: Mistral AI
openness: open

families:
  - name: Mistral
    category: llm
    releases:
      - name: Mistral 7B
        date: 2023-10
        note: "Open-weight; the largest linked checkpoint has about 7.2B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/mistralai/Mistral-7B-v0.1
          - https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.1
        writeups:
          - kind: report
            title: Mistral 7B
            url: https://arxiv.org/abs/2310.06825
      - name: Mixtral 8x7B
        date: 2024-01
        note: "Open-weight; the largest linked checkpoint has about 47B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/mistralai/Mixtral-8x7B-v0.1
          - https://huggingface.co/mistralai/Mixtral-8x7B-Instruct-v0.1
        writeups:
          - kind: report
            title: Mixtral of Experts
            url: https://arxiv.org/abs/2401.04088
      - name: Pixtral 12B
        date: 2024-10
        note: "Open-weight; license: Apache 2.0"
        weights:
          - https://huggingface.co/mistralai/Pixtral-12B-2409
        writeups:
          - kind: report
            title: Pixtral 12B
            url: https://arxiv.org/abs/2410.07073
      - name: Magistral
        date: 2025-06
        note: "Open-weight; the largest linked checkpoint has about 24B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/mistralai/Magistral-Small-2506
        writeups:
          - kind: report
            title: Magistral
            url: https://arxiv.org/abs/2506.10910
      - name: Mistral 3
        date: 2025-12
        weights:
          - https://huggingface.co/mistralai/Mistral-Large-3-675B-Instruct-2512
          - https://huggingface.co/mistralai/Mistral-Large-3-675B-Base-2512
        note: This covers Mistral Large 3 and Ministral 3
        writeups:
          - kind: blog
            title: Introducing Mistral 3
            url: https://mistral.ai/news/mistral-3/
      - name: Ministral 3
        date: 2026-01
        note: Open-weight 3B, 8B, and 14B models in base, instruct, and reasoning variants, Apache 2.0
        weights:
          - https://huggingface.co/mistralai/Ministral-3-14B-Instruct-2512
          - https://huggingface.co/mistralai/Ministral-3-14B-Reasoning-2512
          - https://huggingface.co/mistralai/Ministral-3-8B-Instruct-2512
          - https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512
        writeups:
          - kind: report
            title: Ministral 3
            url: https://arxiv.org/abs/2601.08584

  - name: Voxtral
    category: speech
    releases:
      - name: Voxtral
        date: 2025-07
        note: "Open-weight; the largest linked checkpoint has about 24B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/mistralai/Voxtral-Small-24B-2507
          - https://huggingface.co/mistralai/Voxtral-Mini-3B-2507
        writeups:
          - kind: report
            title: Voxtral
            url: https://arxiv.org/abs/2507.13264
      - name: Voxtral Realtime
        date: 2026-02
        note: Open-weight 4B streaming ASR model, Apache 2.0
        weights:
          - https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-2602
        writeups:
          - kind: report
            title: Voxtral Realtime
            url: https://arxiv.org/abs/2602.11298
      - name: Voxtral Realtime Arabic
        date: 2026-10
        note: Open-weight 4B streaming ASR covering Modern Standard Arabic and regional dialects
        weights:
          - https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-Arabic
        writeups:
          - kind: model-card
            title: Voxtral-Mini-4B-Realtime-Arabic
            url: https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-Arabic
