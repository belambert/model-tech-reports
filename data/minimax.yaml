company: MiniMax
openness: open

families:
  - name: MiniMax
    category: llm
    releases:
      - name: MiniMax-01
        date: 2025-01
        note: Open-weight; the largest linked checkpoint has about 456B total parameters
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-Text-01
          - https://huggingface.co/MiniMaxAI/MiniMax-VL-01
        writeups:
          - kind: report
            title: "MiniMax-01: Scaling Foundation Models with Lightning Attention"
            url: https://arxiv.org/abs/2501.08313
      - name: MiniMax-M1
        date: 2025-06
        note: "Open-weight; the largest linked checkpoint has about 456B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M1-80k
          - https://huggingface.co/MiniMaxAI/MiniMax-M1-40k
        writeups:
          - kind: report
            title: "MiniMax-M1: Scaling Test-Time Compute Efficiently with Lightning Attention"
            url: https://arxiv.org/abs/2506.13585
      - name: MiniMax-M2
        date: 2026-05
        note: Open-weight MoE series (about 229B total parameters); later checkpoints M2.1, M2.5, and M2.7 are on the same org
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M2
          - https://huggingface.co/MiniMaxAI/MiniMax-M2.5
          - https://huggingface.co/MiniMaxAI/MiniMax-M2.7
        writeups:
          - kind: report
            title: "The MiniMax-M2 Series: Mini Activations Unleashing Max Real-World Intelligence"
            url: https://arxiv.org/abs/2605.26494
      - name: MiniMax-M2.5
        date: 2026-02
        note: Open-weight MoE, about 229B total parameters
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M2.5
        writeups:
          - kind: model-card
            title: MiniMax-M2.5
            url: https://huggingface.co/MiniMaxAI/MiniMax-M2.5
      - name: MiniMax-M2.7
        date: 2026-04
        note: Open-weight MoE, about 229B total parameters
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M2.7
        writeups:
          - kind: blog
            title: MiniMax M2.7
            url: https://www.minimax.io/news/minimax-m27-en
          - kind: model-card
            title: MiniMax-M2.7
            url: https://huggingface.co/MiniMaxAI/MiniMax-M2.7
      - name: MiniMax-M3
        date: 2026-06
        note: "Open-weight natively multimodal MoE, about 428B total parameters (23B active); license: the MiniMax Community License"
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M3
        writeups:
          - kind: report
            title: MiniMax Sparse Attention
            url: https://arxiv.org/abs/2606.13392
          - kind: blog
            title: "MiniMax M3: Frontier Coding, 1M Context, Native Multimodality — All in One Model"
            url: https://www.minimax.io/blog/minimax-m3
          - kind: model-card
            title: MiniMax-M3
            url: https://huggingface.co/MiniMaxAI/MiniMax-M3
      - name: MiniMax-M3.1-Flash
        date: 2026-10
        note: Open-weight M3 update with sparse attention throughout, quantization-aware training, and DSpark speculative decoding; MiniMax Community License
        weights:
          - https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash
        writeups:
          - kind: blog
            title: "MiniMax M3.1 Flash: Redefining Agent Performance and Cost"
            url: https://www.minimax.io/blog/minimax-m31f
          - kind: model-card
            title: MiniMax-M3.1-Flash
            url: https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash
