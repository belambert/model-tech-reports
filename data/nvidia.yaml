company: NVIDIA
openness: open

families:
  - name: Nemotron LLMs
    category: llm
    releases:
      - name: Nemotron-4 15B
        date: 2024-02
        writeups:
          - kind: report
            title: Nemotron-4 15B Technical Report
            url: https://arxiv.org/abs/2402.16819
      - name: Nemotron-4 340B
        date: 2024-06
        writeups:
          - kind: report
            title: Nemotron-4 340B Technical Report
            url: https://arxiv.org/abs/2406.11704
      - name: Minitron
        date: 2024-07
        writeups:
          - kind: report
            title: Compact Language Models via Pruning and Knowledge Distillation
            url: https://arxiv.org/abs/2407.14679
      - name: Nemotron-H
        date: 2025-04
        writeups:
          - kind: report
            title: "Nemotron-H: A Family of Accurate and Efficient Hybrid Mamba-Transformer Models"
            url: https://arxiv.org/abs/2504.03624
      - name: Llama-Nemotron
        date: 2025-05
        writeups:
          - kind: report
            title: "Llama-Nemotron: Efficient Reasoning Models"
            url: https://arxiv.org/abs/2505.00949
      - name: Nemotron Nano 2
        date: 2025-08
        writeups:
          - kind: report
            title: "NVIDIA Nemotron Nano 2: An Accurate and Efficient Hybrid Mamba-Transformer Reasoning Model"
            url: https://arxiv.org/abs/2508.14444
      - name: Nemotron 3
        date: 2025-12
        writeups:
          - kind: report
            title: "NVIDIA Nemotron 3: Efficient and Open Intelligence"
            url: https://arxiv.org/abs/2512.20856
      - name: Nemotron 3 Super
        date: 2026-04
        note: Open-weight hybrid Mamba-Transformer MoE, about 120B total and 12B active parameters, with a base model
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16
        writeups:
          - kind: report
            title: "Nemotron 3 Super: Open, Efficient Mixture-of-Experts Hybrid Mamba-Transformer Model for Agentic Reasoning"
            url: https://arxiv.org/abs/2604.12374
      - name: Nemotron 3 Ultra
        date: 2026-06
        note: Open-weight hybrid Mamba-Transformer MoE, about 550B total and 55B active parameters, with base and GenRM checkpoints
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-Base-BF16
        writeups:
          - kind: report
            title: NVIDIA Nemotron 3 Ultra Technical Report
            url: https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Ultra-Technical-Report.pdf
          - kind: model-card
            title: NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      - name: Nemotron 3.5 Lightning
        date: 2026-08
        note: Open-weight 30B-A3B model under the OpenMDW license, with base, NVFP4, and speculative-decoding checkpoints
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Base-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
        writeups:
          - kind: model-card
            title: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16

  - name: Nemotron Multimodal
    category: llm
    releases:
      - name: NVLM
        date: 2024-09
        writeups:
          - kind: report
            title: "NVLM: Open Frontier-Class Multimodal LLMs"
            url: https://arxiv.org/abs/2409.11402
      - name: Nemotron 3 Nano Omni
        date: 2026-04
        note: Open-weight 30B-A3B multimodal reasoning model, in BF16, FP8, and NVFP4
        weights:
          - https://huggingface.co/nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
        writeups:
          - kind: report
            title: "Nemotron 3 Nano Omni: Efficient and Open Multimodal Intelligence"
            url: https://arxiv.org/abs/2604.24954

  - name: Cosmos
    category: world-model
    releases:
      - name: Cosmos
        date: 2025-01
        writeups:
          - kind: report
            title: Cosmos World Foundation Model Platform for Physical AI
            url: https://arxiv.org/abs/2501.03575
      - name: Cosmos-Reason1
        date: 2025-03
        writeups:
          - kind: report
            title: "Cosmos-Reason1: From Physical Common Sense To Embodied Reasoning"
            url: https://arxiv.org/abs/2503.15558
      - name: Cosmos-Predict2.5
        date: 2025-10
        writeups:
          - kind: report
            title: World Simulation with Video Foundation Models for Physical AI
            url: https://arxiv.org/abs/2511.00062
      - name: Cosmos 3
        date: 2026-06
        note: "Open-weight omnimodal world models: Super (about 65B parameters) and Nano (about 16B), plus an Edge variant"
        weights:
          - https://huggingface.co/nvidia/Cosmos3-Super
          - https://huggingface.co/nvidia/Cosmos3-Nano
          - https://huggingface.co/nvidia/Cosmos3-Edge
        writeups:
          - kind: report
            title: "Cosmos 3: Omnimodal World Models for Physical AI"
            url: https://arxiv.org/abs/2606.02800

  - name: GR00T
    category: vla
    releases:
      - name: GR00T N1
        date: 2025-03
        writeups:
          - kind: report
            title: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots"
            url: https://arxiv.org/abs/2503.14734

  - name: FastConformer and TDT (Architecture)
    category: speech
    releases:
      - name: TDT
        date: 2023-04
        writeups:
          - kind: report
            title: Efficient Sequence Transduction by Jointly Predicting Tokens and Durations
