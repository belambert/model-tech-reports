company: NVIDIA
openness: open

families:
  - name: Nemotron LLMs
    category: llm
    releases:
      - name: Nemotron-4 15B
        date: 2024-02
        writeups:
          - kind: report
            title: Nemotron-4 15B Technical Report
            url: https://arxiv.org/abs/2402.16819
      - name: Nemotron-4 340B
        date: 2024-06
        note: "Open-weight; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/Nemotron-4-340B-Instruct
          - https://huggingface.co/nvidia/Nemotron-4-340B-Base
        writeups:
          - kind: report
            title: Nemotron-4 340B Technical Report
            url: https://arxiv.org/abs/2406.11704
      - name: Minitron
        date: 2024-07
        note: "Open-weight; the largest linked checkpoint has about 8.4B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/Mistral-NeMo-Minitron-8B-Base
          - https://huggingface.co/nvidia/Llama-3.1-Minitron-4B-Width-Base
        writeups:
          - kind: report
            title: Compact Language Models via Pruning and Knowledge Distillation
            url: https://arxiv.org/abs/2407.14679
      - name: Nemotron-H
        date: 2025-04
        note: "Open-weight; the largest linked checkpoint has about 56B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/Nemotron-H-56B-Base-8K
          - https://huggingface.co/nvidia/Nemotron-H-47B-Reasoning-128K
          - https://huggingface.co/nvidia/Nemotron-H-8B-Base-8K
        writeups:
          - kind: report
            title: "Nemotron-H: A Family of Accurate and Efficient Hybrid Mamba-Transformer Models"
            url: https://arxiv.org/abs/2504.03624
      - name: Llama-Nemotron
        date: 2025-05
        note: "Open-weight; the largest linked checkpoint has about 253B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/Llama-3_1-Nemotron-Ultra-253B-v1
          - https://huggingface.co/nvidia/Llama-3_3-Nemotron-Super-49B-v1
          - https://huggingface.co/nvidia/Llama-3.1-Nemotron-Nano-8B-v1
        writeups:
          - kind: report
            title: "Llama-Nemotron: Efficient Reasoning Models"
            url: https://arxiv.org/abs/2505.00949
      - name: Nemotron Nano 2
        date: 2025-08
        note: "Open-weight; the largest linked checkpoint has about 8.9B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-9B-v2
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-Nano-12B-v2
        writeups:
          - kind: report
            title: "NVIDIA Nemotron Nano 2: An Accurate and Efficient Hybrid Mamba-Transformer Reasoning Model"
            url: https://arxiv.org/abs/2508.14444
      - name: Nemotron 3
        date: 2025-12
        note: "Open-weight; the largest linked checkpoint has about 32B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
        writeups:
          - kind: report
            title: "NVIDIA Nemotron 3: Efficient and Open Intelligence"
            url: https://arxiv.org/abs/2512.20856
      - name: Nemotron 3 Super
        date: 2026-04
        note: Open-weight hybrid Mamba-Transformer MoE, about 120B total and 12B active parameters, with a base model
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16
        writeups:
          - kind: report
            title: "Nemotron 3 Super: Open, Efficient Mixture-of-Experts Hybrid Mamba-Transformer Model for Agentic Reasoning"
            url: https://arxiv.org/abs/2604.12374
      - name: Nemotron 3 Ultra
        date: 2026-06
        note: Open-weight hybrid Mamba-Transformer MoE, about 550B total and 55B active parameters, with base and GenRM checkpoints
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-Base-BF16
        writeups:
          - kind: report
            title: NVIDIA Nemotron 3 Ultra Technical Report
            url: https://research.nvidia.com/labs/nemotron/files/NVIDIA-Nemotron-3-Ultra-Technical-Report.pdf
          - kind: model-card
            title: NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      - name: Nemotron 3.5 Lightning
        date: 2026-08
        note: Open-weight 30B-A3B model under the OpenMDW license, with base, NVFP4, and speculative-decoding checkpoints
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-Base-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
        writeups:
          - kind: model-card
            title: NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
      - name: Nemotron 3.5 Bolt
        date: 2026-10
        note: Open-weight edge-agent models under the OpenMDW license; the 74B-A9B (9B active) is a 2-bit vision-language model that fits in 24GB, and Bolt E4B is a text-only 8B model post-trained from Gemma 4 E4B
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
        writeups:
          - kind: model-card
            title: NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
          - kind: model-card
            title: NVIDIA-Nemotron-3.5-Bolt-E4B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-BF16

  - name: Nemotron Multimodal
    category: llm
    releases:
      - name: NVLM
        date: 2024-09
        note: "Open-weight; the largest linked checkpoint has about 79B total parameters; license: CC BY-NC 4.0"
        weights:
          - https://huggingface.co/nvidia/NVLM-D-72B
        writeups:
          - kind: report
            title: "NVLM: Open Frontier-Class Multimodal LLMs"
            url: https://arxiv.org/abs/2409.11402
      - name: Nemotron 3 Nano Omni
        date: 2026-04
        note: Open-weight 30B-A3B multimodal reasoning model, in BF16, FP8, and NVFP4
        weights:
          - https://huggingface.co/nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
        writeups:
          - kind: report
            title: "Nemotron 3 Nano Omni: Efficient and Open Multimodal Intelligence"
            url: https://arxiv.org/abs/2604.24954
      - name: Nemotron 3.5 Super VL
        date: 2026-10
        note: Open-weight hybrid Mamba-Transformer MoE vision-language model, about 120B total and 12B active parameters, with a C-RADIO vision encoder; OpenMDW license
        weights:
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
          - https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Base-BF16
        writeups:
          - kind: model-card
            title: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
            url: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16

  - name: Cosmos
    category: world-model
    releases:
      - name: Cosmos
        date: 2025-01
        note: "Open-weight; license: a custom license"
        weights:
          - https://huggingface.co/nvidia/Cosmos-1.0-Diffusion-7B-Text2World
