company: Hugging Face
openness: open

families:
  - name: SmolLM and SmolVLM
    category: llm
    releases:
      - name: SmolLM2
        date: 2025-02
        note: "Open-weight; the largest linked checkpoint has about 1.7B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct
          - https://huggingface.co/HuggingFaceTB/SmolLM2-360M-Instruct
          - https://huggingface.co/HuggingFaceTB/SmolLM2-135M-Instruct
        writeups:
          - kind: report
            title: "SmolLM2: When Smol Goes Big -- Data-Centric Training of a Small Language Model"
            url: https://arxiv.org/abs/2502.02737
      - name: SmolVLM
        date: 2025-04
        note: "Open-weight; the largest linked checkpoint has about 2.2B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/HuggingFaceTB/SmolVLM-Instruct
          - https://huggingface.co/HuggingFaceTB/SmolVLM2-2.2B-Instruct
        writeups:
          - kind: report
            title: "SmolVLM: Redefining small and efficient multimodal models"
            url: https://arxiv.org/abs/2504.05299

  - name: SmolVLA
    category: vla
    releases:
      - name: SmolVLA
        date: 2025-06
        note: "Open-weight; the largest linked checkpoint has about 0.5B total parameters; license: Apache 2.0"
        weights:
          - https://huggingface.co/lerobot/smolvla_base
        writeups:
          - kind: report
            title: "SmolVLA: A Vision-Language-Action Model for Affordable and Efficient Robotics"
            url: https://arxiv.org/abs/2506.01844
