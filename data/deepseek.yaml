company: DeepSeek
openness: open

families:
  - name: DeepSeek LLMs
    category: llm
    releases:
      - name: DeepSeek LLM
        date: 2024-01
        note: "Open-weight; license: a custom license"
        weights:
          - https://huggingface.co/deepseek-ai/deepseek-llm-67b-chat
          - https://huggingface.co/deepseek-ai/deepseek-llm-7b-chat
        writeups:
          - kind: report
            title: "DeepSeek LLM: Scaling Open-Source Language Models with Longtermism"
            url: https://arxiv.org/abs/2401.02954
      - name: DeepSeekMoE
        date: 2024-01
        note: "Open-weight; the largest linked checkpoint has about 16B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/deepseek-ai/deepseek-moe-16b-chat
          - https://huggingface.co/deepseek-ai/deepseek-moe-16b-base
        writeups:
          - kind: report
            title: "DeepSeekMoE: Towards Ultimate Expert Specialization in Mixture-of-Experts Language Models"
            url: https://arxiv.org/abs/2401.06066
      - name: DeepSeek-V2
        date: 2024-05
        note: "Open-weight; the largest linked checkpoint has about 236B total parameters; license: a custom license"
        weights:
          - https://huggingface.co/deepseek-ai/DeepSeek-V2
          - https://huggingface.co/deepseek-ai/DeepSeek-V2-Lite
        writeups:
          - kind: report
            title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model"
            url: https://arxiv.org/abs/2405.04434
      - name: DeepSeek-V3
        date: 2024-12
        note: Open-weight; the largest linked checkpoint has about 685B total parameters
