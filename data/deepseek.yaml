          - kind: report
            title: DeepSeek-V3 Technical Report
            url: https://arxiv.org/abs/2412.19437
      - name: DeepSeek-V3.2
        date: 2025-12
        note: "Open-weight; the largest linked checkpoint has about 685B total parameters; license: MIT"
        weights:
          - https://huggingface.co/deepseek-ai/DeepSeek-V3.2
          - https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp
        writeups:
          - kind: report
            title: "DeepSeek-V3.2: Pushing the Frontier of Open Large Language Models"
            url: https://arxiv.org/abs/2512.02556
      - name: DeepSeek-V4
        date: 2026-04
        note: "Open-weight MoE under MIT: V4-Pro (about 1.6T total parameters) and V4-Flash (about 290B), both with base models"
